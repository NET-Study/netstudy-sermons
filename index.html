<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NET Study Sermons</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="traffic-pad" data-tauri-drag-region></div>
        <div class="brand" data-tauri-drag-region>
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
              <path d="M4 14h2.2a1 1 0 0 1 1 1v3.6a1 1 0 0 1-1 1H5.6A1.6 1.6 0 0 1 4 18V14Z" />
              <path d="M20 14h-2.2a1 1 0 0 0-1 1v3.6a1 1 0 0 0 1 1h.6a1.6 1.6 0 0 0 1.6-1.6V14Z" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">NET Study</span>
            <span class="brand-sub">Sermons</span>
          </div>
        </div>

        <nav id="nav">
          <button class="nav-item" data-nav="home"><span class="nav-glyph">◈</span>Home</button>
          <button class="nav-item" data-nav="scripture"><span class="nav-glyph">✧</span>Scripture</button>
          <button class="nav-item" data-nav="topics"><span class="nav-glyph">❖</span>Topics</button>
          <button class="nav-item" data-nav="speakers"><span class="nav-glyph">☗</span>Preachers</button>
          <button class="nav-item" data-nav="recent"><span class="nav-glyph">↺</span>Recently played</button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-foot">
          <div id="library-counts" class="counts"></div>
          <a id="attribution" href="#" class="attribution">Data from SermonIndex.net</a>
        </div>
      </aside>

      <div id="main-col">
        <header id="topbar" data-tauri-drag-region>
          <button id="back-btn" class="icon-btn" title="Back">‹</button>
          <div id="crumbs" class="crumbs"></div>
          <div class="topbar-spacer" data-tauri-drag-region></div>
          <div class="search-wrap">
            <svg class="search-glyph" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
            </svg>
            <input id="search" type="text" placeholder="John 3:16, revival, Ravenhill…" spellcheck="false" autocomplete="off" />
            <kbd id="search-hint">⌘K</kbd>
          </div>
          <button id="theme-btn" class="icon-btn" title="Appearance">◐</button>
        </header>
        <main id="content" tabindex="-1"></main>
      </div>
    </div>

    <div id="player" class="player hidden">
      <button id="np-art" class="np-art"></button>
      <div class="np-meta">
        <div class="np-title" id="np-title"></div>
        <div class="np-sub" id="np-sub"></div>
      </div>
      <div class="np-controls">
        <button class="icon-btn" id="prev-btn" title="Previous">⏮</button>
        <button class="icon-btn" id="back15" title="Back 15 seconds">↺15</button>
        <button class="play-btn" id="play-btn" title="Play / pause">▶</button>
        <button class="icon-btn" id="fwd15" title="Forward 30 seconds">30↻</button>
        <button class="icon-btn" id="next-btn" title="Next">⏭</button>
      </div>
      <div class="np-progress">
        <span class="time" id="cur-time">0:00</span>
        <div class="track" id="track"><div class="track-fill" id="track-fill"></div><div class="track-knob" id="track-knob"></div></div>
        <span class="time" id="dur-time">0:00</span>
      </div>
      <div class="np-extras">
        <button class="pill-btn" id="rate-btn" title="Playback speed">1×</button>
        <button class="pill-btn" id="video-btn" title="Video">▣</button>
        <button class="pill-btn" id="queue-btn" title="Queue">≡</button>
      </div>
    </div>

    <div id="video-overlay" class="video-overlay hidden">
      <button id="video-close" class="icon-btn video-close" title="Close">✕</button>
      <video id="video" controls playsinline></video>
    </div>

    <div id="queue-pop" class="queue-pop hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
